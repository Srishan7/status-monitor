<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Monitor</title>
<style>
:root {
  --bg:      #080d18;
  --surface: #0f1624;
  --border:  #1c2b42;
  --text:    #dde4f0;
  --muted:   #4a6080;
  --up:      #23d18b;
  --down:    #f05050;
  --warn:    #f0a830;
}
*{box-sizing:border-box;margin:0;padding:0}
body {
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  font-size:13px; line-height:1.5; min-height:100vh; padding:1.25rem 1.5rem;
}

/* ── TOP BAR ── */
.topbar { display:flex; align-items:center; gap:0.65rem; margin-bottom:0.75rem; flex-wrap:wrap; }
.brand  { display:flex; align-items:center; gap:0.5rem; margin-right:0.2rem; flex-shrink:0; }
.brand-dot  { width:8px;height:8px;border-radius:50%;background:#00c8f0;box-shadow:0 0 9px #00c8f0; }
.brand-name { font-size:0.64rem;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted); }

.select-wrap { position:relative; flex-shrink:0; }
.select-wrap select {
  appearance:none;-webkit-appearance:none;
  background:var(--surface); border:1px solid var(--border);
  border-radius:7px; color:var(--text); font-size:0.8rem; font-family:inherit;
  padding:0.3rem 2.1rem 0.3rem 0.8rem; cursor:pointer; outline:none; min-width:210px;
  transition:border-color .15s;
}
.select-wrap select:focus { border-color:#00c8f0; }
.select-wrap::after {
  content:'▾'; position:absolute; right:0.65rem; top:50%;
  transform:translateY(-50%); color:var(--muted); pointer-events:none; font-size:0.72rem;
}

.pills { display:flex; gap:0.3rem; margin-left:auto; }
.pill {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); border-radius:5px; padding:0.24rem 0.55rem;
  font-size:0.68rem; font-weight:600; cursor:pointer; font-family:monospace; transition:all .15s;
}
.pill:hover { border-color:var(--muted); color:var(--text); }
.pill.active { background:#00c8f0; border-color:#00c8f0; color:#080d18; }

.icon-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--muted); border-radius:5px; padding:0.24rem 0.65rem;
  font-size:0.72rem; cursor:pointer; transition:all .15s;
  display:flex; align-items:center; gap:0.3rem; white-space:nowrap; flex-shrink:0;
}
.icon-btn:hover { border-color:var(--muted); color:var(--text); }
.icon-btn.on     { border-color:var(--up);   color:var(--up);   }
.icon-btn.paused { border-color:var(--warn); color:var(--warn); }
.icon-btn.notify-on { border-color:#a78bfa; color:#a78bfa; }
.icon-btn.denied { border-color:var(--down); color:var(--down); opacity:.6; cursor:not-allowed; }

/* ── SESSION INFO BAR ── */
.session-bar {
  display:flex; align-items:center; justify-content:space-between;
  font-size:0.63rem; color:var(--muted);
  margin-bottom:0.85rem; flex-wrap:wrap; gap:0.5rem;
}
.session-chip {
  display:inline-flex; align-items:center; gap:0.35rem;
  background:rgba(0,200,240,0.07); border:1px solid rgba(0,200,240,0.15);
  border-radius:4px; padding:0.12rem 0.5rem; font-size:0.61rem;
}
.session-chip span { color:#00c8f0; font-family:monospace; }

/* ── ADD URL ── */
.add-row {
  display:flex; gap:0.5rem;
  background:var(--surface); border:1px solid var(--border);
  border-radius:7px; padding:0.3rem 0.3rem 0.3rem 0.8rem; margin-bottom:1rem;
}
.add-row input {
  flex:1; background:transparent; border:none; outline:none;
  color:#00c8f0; font-family:monospace; font-size:0.76rem;
}
.add-row input::placeholder { color:var(--muted); }
.add-row button {
  background:#00c8f0; color:#080d18; border:none;
  padding:0.26rem 0.85rem; border-radius:5px; cursor:pointer;
  font-size:0.65rem; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
}
.add-row button:hover { opacity:.82; }

/* ── STRIP ── */
.strip { display:flex; gap:0.45rem; flex-wrap:wrap; align-items:center; margin-bottom:1rem; }
.strip-label { font-size:0.58rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-right:0.3rem; }
.strip-pill {
  display:flex; align-items:center; gap:0.38rem;
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:0.2rem 0.65rem 0.2rem 0.42rem;
  cursor:pointer; transition:all .15s; font-size:0.7rem; user-select:none;
}
.strip-pill:hover { border-color:var(--muted); }
.strip-pill.active { border-color:var(--text); }
.strip-dot  { width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:background .3s; }
.strip-name { color:var(--muted); }
.strip-pill.active .strip-name { color:var(--text); }
.strip-lat  { font-family:monospace; font-size:0.66rem; color:var(--muted); margin-left:0.15rem; }
.strip-remove {
  background:none; border:none; color:var(--muted); cursor:pointer;
  font-size:0.8rem; margin-left:0.2rem; padding:0; line-height:1;
  opacity:0; transition:opacity .15s;
}
.strip-pill:hover .strip-remove { opacity:1; }

/* ── MAIN CARD ── */
.main-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:1.25rem 1.4rem 1.1rem;
  margin-bottom:1rem; position:relative; overflow:hidden;
}
.main-card::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:var(--section-color,#00c8f0);
}
.mc-header {
  display:flex; align-items:flex-start; justify-content:space-between;
  margin-bottom:1rem; flex-wrap:wrap; gap:0.75rem;
}
.mc-left { display:flex; flex-direction:column; gap:0.3rem; }
.mc-status-row { display:flex; align-items:center; gap:0.55rem; }
.mc-big-dot { width:11px;height:11px;border-radius:50%;flex-shrink:0; }
.mc-big-dot.up   { background:var(--up);   animation:ping 1.4s infinite; }
.mc-big-dot.down { background:var(--down); }
.mc-state { font-size:1.45rem; font-weight:800; letter-spacing:-0.02em; }
.mc-state.up   { color:var(--up);   }
.mc-state.down { color:var(--down); }
.mc-url   { font-family:monospace; font-size:0.69rem; color:var(--muted); word-break:break-all; }
.mc-right { text-align:right; flex-shrink:0; }
.mc-lat-row { display:flex; align-items:baseline; justify-content:flex-end; gap:0.25rem; }
.mc-lat-big { font-size:2.6rem; font-weight:800; letter-spacing:-0.04em; font-variant-numeric:tabular-nums; line-height:1; }
.mc-lat-unit { font-size:0.85rem; color:var(--muted); }
.mc-pings { font-size:0.63rem; color:var(--muted); margin-top:0.2rem; font-variant-numeric:tabular-nums; }

/* Metric tiles */
.metrics-grid {
  display:grid; grid-template-columns:repeat(auto-fill,minmax(115px,1fr));
  gap:0.55rem; margin-bottom:0.75rem;
}
.metric-tile {
  background:rgba(255,255,255,0.028); border:1px solid var(--border);
  border-radius:8px; padding:0.6rem 0.75rem;
}
.mt-label { font-size:0.56rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); margin-bottom:0.25rem; }
.mt-row   { display:flex; align-items:baseline; gap:0.3rem; }
.mt-val   { font-size:1.05rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--text); }
.mt-val.good { color:var(--up);   }
.mt-val.warn { color:var(--warn); }
.mt-val.bad  { color:var(--down); }
.mt-unit  { font-size:0.6rem; color:var(--muted); }

/* SLA threshold control */
.sla-row {
  display:flex; align-items:center; gap:0.5rem;
  margin-bottom:0.75rem; font-size:0.68rem; flex-wrap:wrap;
}
.sla-row label { color:var(--muted); }
.sla-input {
  background:var(--bg); border:1px solid var(--border);
  color:var(--text); border-radius:5px; padding:0.18rem 0.45rem;
  font-family:monospace; font-size:0.72rem; width:66px; outline:none;
  transition:border-color .15s;
}
.sla-input:focus { border-color:#00c8f0; }
.sla-unit { color:var(--muted); }
.sla-apply {
  background:var(--border); border:none; color:var(--muted);
  border-radius:4px; padding:0.18rem 0.55rem;
  font-size:0.62rem; cursor:pointer; letter-spacing:0.06em; text-transform:uppercase;
  transition:color .15s;
}
.sla-apply:hover { color:var(--text); }
.sla-hint { font-size:0.6rem; color:var(--muted); margin-left:0.25rem; }

/* Trend row */
.trend-row { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.75rem; font-size:0.7rem; color:var(--muted); flex-wrap:wrap; }
.trend-chip { font-size:0.68rem; font-weight:600; padding:0.1rem 0.5rem; border-radius:4px; font-family:monospace; }
.trend-chip.rising  { background:rgba(240,168,48,0.15); color:var(--warn); }
.trend-chip.falling { background:rgba(35,209,139,0.15); color:var(--up);   }
.trend-chip.stable  { background:rgba(74,96,128,0.18);  color:var(--muted);}
.trend-sep { color:var(--border); }

/* Sub-chart labels */
.sub-label {
  font-size:0.56rem; text-transform:uppercase; letter-spacing:0.1em;
  color:var(--muted); margin:0.85rem 0 0.4rem;
  display:flex; align-items:center; gap:0.5rem;
}
.sub-note { font-size:0.55rem; font-variant-numeric:tabular-nums; }

canvas.block { width:100%; display:block; }

/* ── CHART CARDS ── */
.chart-card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:10px; padding:0.9rem 1.1rem; margin-bottom:1rem;
}
.chart-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.65rem; flex-wrap:wrap; gap:0.4rem; }
.chart-title { font-size:0.59rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
.legend { display:flex; gap:0.75rem; flex-wrap:wrap; }
.legend-item { display:flex; align-items:center; gap:0.3rem; font-size:0.64rem; color:var(--muted); }
.legend-dot  { width:7px;height:7px;border-radius:50%; }

/* ── LOG ── */
.log-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.log-hdr { display:flex; align-items:center; justify-content:space-between; padding:0.5rem 1rem; border-bottom:1px solid var(--border); }
.log-hdr-left { display:flex; align-items:center; gap:0.65rem; }
.log-hdr-title { font-size:0.59rem; text-transform:uppercase; letter-spacing:0.1em; color:var(--muted); }
.log-filter-btn {
  font-size:0.59rem; text-transform:uppercase; letter-spacing:0.07em;
  background:var(--border); color:var(--muted); border:none;
  border-radius:4px; padding:0.14rem 0.5rem; cursor:pointer;
}
.log-filter-btn:hover { color:var(--text); }
.log-clear { background:none; border:none; color:var(--muted); font-size:0.59rem; cursor:pointer; text-transform:uppercase; letter-spacing:0.06em; }
.log-clear:hover { color:var(--text); }
.log-body { height:155px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
.log-body::-webkit-scrollbar { width:3px; }
.log-body::-webkit-scrollbar-thumb { background:var(--border); }
.log-row {
  display:grid; grid-template-columns:80px 42px 68px 1fr;
  padding:0.19rem 1rem 0.19rem 0.8rem;
  font-family:monospace; font-size:0.68rem;
  border-bottom:1px solid rgba(255,255,255,0.025);
  font-variant-numeric:tabular-nums; border-left:3px solid transparent;
}
.log-ts { color:var(--muted); }
.log-st { font-weight:700; }
.log-st.up { color:var(--up);   }
.log-st.dn { color:var(--down); }
.log-lbl { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

@keyframes ping {
  0%   { box-shadow:0 0 0 0 rgba(35,209,139,0.5); }
  70%  { box-shadow:0 0 0 7px transparent; }
  100% { box-shadow:0 0 0 0 transparent; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-dot"></div>
    <span class="brand-name">Status Monitor</span>
  </div>
  <div class="select-wrap">
    <select id="urlSelect" onchange="onSelectChange()"></select>
  </div>
  <div class="pills">
    <button class="pill active" data-sec="1"  onclick="setIntervalSec(1)">1s</button>
    <button class="pill"        data-sec="2"  onclick="setIntervalSec(2)">2s</button>
    <button class="pill"        data-sec="5"  onclick="setIntervalSec(5)">5s</button>
    <button class="pill"        data-sec="10" onclick="setIntervalSec(10)">10s</button>
    <button class="pill"        data-sec="30" onclick="setIntervalSec(30)">30s</button>
  </div>
  <button class="icon-btn" id="soundBtn"  onclick="toggleSound()">🔕 Sound</button>
  <button class="icon-btn" id="notifyBtn" onclick="toggleNotify()">🔔 Notify</button>
  <button class="icon-btn" id="checkBtn"  onclick="checkNow()">⟳ Now</button>
  <button class="icon-btn" id="pauseBtn"  onclick="togglePause()">⏸ Pause</button>
</div>

<div class="session-bar" id="sessionBar"></div>

<div class="add-row">
  <input id="addInput" type="text" placeholder="Add a URL to monitor…" spellcheck="false"
         onkeydown="if(event.key==='Enter') addUrl()">
  <button onclick="addUrl()">+ Add</button>
</div>

<div class="strip" id="strip">
  <span class="strip-label">All</span>
</div>

<!-- ── MAIN SECTION CARD ── -->
<div class="main-card" id="mainCard">
  <div class="mc-header">
    <div class="mc-left">
      <div class="mc-status-row">
        <span class="mc-big-dot up" id="mc-dot"></span>
        <span class="mc-state up"   id="mc-state">—</span>
      </div>
      <span class="mc-url" id="mc-url"></span>
    </div>
    <div class="mc-right">
      <div class="mc-lat-row">
        <span class="mc-lat-big" id="mc-lat">—</span>
        <span class="mc-lat-unit">ms</span>
      </div>
      <div class="mc-pings" id="mc-pings">0 pings</div>
    </div>
  </div>

  <div class="metrics-grid" id="metricsGrid"></div>

  <!-- SLA threshold control -->
  <div class="sla-row">
    <label for="slaInput">SLA target</label>
    <input id="slaInput" class="sla-input" type="number" min="50" max="30000" step="50" value="500"
           onkeydown="if(event.key==='Enter') applySlaThreshold()">
    <span class="sla-unit">ms</span>
    <button class="sla-apply" onclick="applySlaThreshold()">Apply</button>
    <span class="sla-hint" id="slaHint"></span>
  </div>

  <div class="trend-row" id="trendRow"></div>

  <div class="sub-label">Latency over time</div>
  <canvas id="mainChart" class="block" height="120"></canvas>

  <div class="sub-label">
    Ping history · last 60
    <span class="sub-note" id="stripNote"></span>
  </div>
  <canvas id="statusStrip" class="block" height="14"></canvas>

  <div class="sub-label">Latency distribution</div>
  <canvas id="histChart" class="block" height="84"></canvas>
</div>

<!-- ── COMPARISON CARD ── -->
<div class="chart-card">
  <div class="chart-hdr">
    <span class="chart-title">Current latency · all endpoints</span>
    <span style="font-size:0.59rem;color:var(--muted)">bar = now · dashed = avg · amber = p95</span>
  </div>
  <canvas id="compChart" class="block"></canvas>
</div>

<!-- ── ALL-URLS COMBINED CHART ── -->
<div class="chart-card">
  <div class="chart-hdr">
    <span class="chart-title">All endpoints · last 60 s</span>
    <div class="legend" id="legend"></div>
  </div>
  <canvas id="bigChart" class="block" height="90"></canvas>
</div>

<div class="log-card">
  <div class="log-hdr">
    <div class="log-hdr-left">
      <span class="log-hdr-title">Live Log</span>
      <button class="log-filter-btn" id="logFilterBtn" onclick="toggleLogFilter()">All URLs</button>
    </div>
    <button class="log-clear" onclick="clearLog()">Clear</button>
  </div>
  <div class="log-body" id="logBody"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
const PALETTE       = ['#00c8f0','#a78bfa','#fbbf24','#fb7185','#34d399','#f97316','#60a5fa','#e879f9'];
const STORAGE_KEY   = 'status-monitor-v1';
const DEFAULT_MONITORS = [
  { id:'u0', url:'https://marici.org/shine',                            label:'marici.org/shine',          color:'#00c8f0', slaThreshold:500 },
  { id:'u1', url:'https://marici.org',                                  label:'marici.org',                 color:'#a78bfa', slaThreshold:200 },
  { id:'u2', url:'https://secure.qgiv.com/for/businessmasteryaug2026/', label:'qgiv · businessmastery',    color:'#fbbf24', slaThreshold:500 },
  { id:'u3', url:'https://givebutter.com/marici-shine',                 label:'givebutter · marici-shine',  color:'#fb7185', slaThreshold:500 },
];
let paletteIdx = DEFAULT_MONITORS.length;

let monitors = [];
const state  = {};

let selectedId        = DEFAULT_MONITORS[0].id;
let intervalMs        = 1000;
let paused            = false;
let soundOn           = false;
let notifyEnabled     = false;
let logFilterSelected = false;
let timerId           = null;
let sessionStart      = new Date();
let priorPingsLoaded  = 0;

function initState(id) {
  state[id] = {
    hist:           [],
    totalPings:     0,
    totalUp:        0,
    totalIncidents: 0,
    lastDownAt:     null,
    prevUp:         true,
  };
}

// ── LocalStorage ─────────────────────────────────────────────
function saveToStorage() {
  try {
    const data = {
      monitors,
      selectedId,
      intervalMs,
      state: Object.fromEntries(
        Object.entries(state).map(([id, s]) => [id, {
          hist:           s.hist.map(h => ({ ts: h.ts.getTime(), up: h.up, latency: h.latency })),
          totalPings:     s.totalPings,
          totalUp:        s.totalUp,
          totalIncidents: s.totalIncidents,
          lastDownAt:     s.lastDownAt ? s.lastDownAt.getTime() : null,
        }])
      ),
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (_) {}
}

function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data.monitors || !data.monitors.length) return false;

    monitors = data.monitors;
    selectedId = data.selectedId || monitors[0].id;
    intervalMs = data.intervalMs || 1000;

    monitors.forEach(m => {
      if (!m.slaThreshold) m.slaThreshold = 500;
      const saved = data.state && data.state[m.id];
      if (saved) {
        state[m.id] = {
          hist:           saved.hist.map(h => ({ ts: new Date(h.ts), up: h.up, latency: h.latency })),
          totalPings:     saved.totalPings,
          totalUp:        saved.totalUp,
          totalIncidents: saved.totalIncidents,
          lastDownAt:     saved.lastDownAt ? new Date(saved.lastDownAt) : null,
          prevUp:         saved.hist.length ? saved.hist[saved.hist.length - 1].up : true,
        };
        priorPingsLoaded += saved.totalPings;
      } else {
        initState(m.id);
      }
    });
    return true;
  } catch (_) {
    return false;
  }
}

function clearStorage() {
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
}

// ── Session bar ───────────────────────────────────────────────
function renderSessionBar() {
  const bar = document.getElementById('sessionBar');
  const timeStr = sessionStart.toLocaleTimeString();
  const totalPings = Object.values(state).reduce((a, s) => a + s.totalPings, 0);
  let html = `<span>Started ${timeStr}</span>`;
  if (priorPingsLoaded > 0) {
    html += `<div class="session-chip">📦 Resumed · <span>${priorPingsLoaded.toLocaleString()}</span> pings loaded from last session</div>`;
  }
  html += `<span style="margin-left:auto;font-variant-numeric:tabular-nums">${totalPings.toLocaleString()} total pings this session · <button onclick="clearStorage()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.63rem;text-decoration:underline">Reset</button></span>`;
  bar.innerHTML = html;
}

// ── Ping ─────────────────────────────────────────────────────
function ping(url) {
  return new Promise(resolve => {
    const img  = new Image();
    const t0   = performance.now();
    let   done = false;
    const fin  = up => {
      if (done) return; done = true;
      clearTimeout(tid);
      resolve({ up, latency: up ? Math.round(performance.now() - t0) : null });
    };
    const tid = setTimeout(() => fin(false), 5000);
    img.onload  = () => fin(true);
    img.onerror = () => fin(true);
    img.src = url + (url.includes('?') ? '&' : '?') + '_t=' + Date.now();
  });
}

// ── Tick ─────────────────────────────────────────────────────
let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveToStorage, 3000);
}

async function tick() {
  if (paused) return;
  monitors.forEach((m, i) => {
    setTimeout(async () => {
      const ts = new Date();
      const r  = await ping(m.url);
      const s  = state[m.id];
      s.totalPings++;
      if (r.up) s.totalUp++;
      if (!r.up && s.prevUp) {
        s.totalIncidents++;
        s.lastDownAt = ts;
        if (soundOn)    beep();
        if (notifyEnabled) showNotification(m);
      }
      s.prevUp = r.up;
      s.hist.push({ ts, ...r });
      if (s.hist.length > 60) s.hist.shift();

      updateStripPill(m, r);
      if (m.id === selectedId) refreshMainCard(m);
      appendLog(m, r, ts);
      drawBigChart();
      drawComparisonChart();
      renderSessionBar();
      scheduleSave();
    }, i * 130);
  });
}

// ── Metrics ───────────────────────────────────────────────────
function computeMetrics(id) {
  const m    = monitors.find(x => x.id === id);
  const s    = state[id];
  const thr  = m ? (m.slaThreshold || 500) : 500;
  const lats = s.hist.filter(h => h.latency != null).map(h => h.latency);
  const srt  = [...lats].sort((a, b) => a - b);

  const avg    = lats.length ? Math.round(lats.reduce((a,b) => a+b, 0) / lats.length) : null;
  const p95    = srt.length >= 5  ? srt[Math.floor(srt.length * 0.95)] : null;
  const p99    = srt.length >= 10 ? srt[Math.floor(srt.length * 0.99)] : null;
  const jitter = (lats.length >= 2 && avg != null)
    ? Math.round(Math.sqrt(lats.map(l => (l - avg) ** 2).reduce((a,b) => a+b, 0) / lats.length))
    : null;
  const sla    = lats.length ? Math.round(lats.filter(l => l <= thr).length / lats.length * 100) : null;
  const uptime = s.totalPings ? (s.totalUp / s.totalPings * 100) : null;

  let trend = null;
  if (lats.length >= 20) {
    const aLast = lats.slice(-10).reduce((a,b) => a+b, 0) / 10;
    const aPrev = lats.slice(-20, -10).reduce((a,b) => a+b, 0) / 10;
    const delta = (aLast - aPrev) / aPrev;
    trend = delta > 0.12 ? 'rising' : delta < -0.12 ? 'falling' : 'stable';
  }

  let lastDown = 'never';
  if (s.lastDownAt) {
    const sec = Math.round((Date.now() - s.lastDownAt) / 1000);
    lastDown = sec < 60 ? sec + 's ago' : sec < 3600 ? Math.round(sec/60) + 'm ago' : Math.round(sec/3600) + 'h ago';
  }

  return {
    avg, p95, p99, jitter, sla, slaThreshold: thr, uptime, trend,
    incidents: s.totalIncidents, lastDown,
    min: srt[0] ?? null, max: srt[srt.length-1] ?? null,
  };
}

// ── Main card refresh ─────────────────────────────────────────
function refreshMainCard(m) {
  const s    = state[m.id];
  const M    = computeMetrics(m.id);
  const last = s.hist[s.hist.length - 1];
  const r    = last || { up: true, latency: null };

  document.getElementById('mainCard').style.setProperty('--section-color', m.color);

  const dot = document.getElementById('mc-dot');
  const st  = document.getElementById('mc-state');
  dot.className   = 'mc-big-dot ' + (r.up ? 'up' : 'down');
  st.className    = 'mc-state '   + (r.up ? 'up' : 'down');
  st.textContent  = r.up ? 'UP' : 'DOWN';
  document.getElementById('mc-url').textContent = m.url;

  const latEl = document.getElementById('mc-lat');
  latEl.textContent = r.latency ?? '—';
  latEl.style.color = r.latency == null ? 'var(--down)' : m.color;

  document.getElementById('mc-pings').textContent =
    s.totalPings.toLocaleString() + ' pings · ' +
    (M.uptime != null ? M.uptime.toFixed(2) + '% up' : '—');

  // SLA input sync
  document.getElementById('slaInput').value = M.slaThreshold;
  const hint = document.getElementById('slaHint');
  hint.textContent = M.sla != null
    ? `${M.sla}% of pings ≤${M.slaThreshold}ms`
    : 'waiting for data…';
  hint.style.color = M.sla == null ? 'var(--muted)' :
    M.sla >= 90 ? 'var(--up)' : M.sla >= 70 ? 'var(--warn)' : 'var(--down)';

  const c3 = (v, hi, lo) => v == null ? '' : v >= hi ? 'good' : v >= lo ? 'warn' : 'bad';

  document.getElementById('metricsGrid').innerHTML = [
    { label:'Uptime',            val: M.uptime   != null ? M.uptime.toFixed(2)+'%' : '—',  unit:'',   cls: c3(M.uptime,  99, 95) },
    { label:'Avg',               val: M.avg      ?? '—',                                    unit:'ms', cls: '' },
    { label:'P95',               val: M.p95      ?? '—',                                    unit:'ms', cls: M.p95    != null && M.p95    > 1500 ? 'warn' : '' },
    { label:'P99',               val: M.p99      ?? '—',                                    unit:'ms', cls: M.p99    != null && M.p99    > 3000 ? 'bad'  : '' },
    { label:'Jitter σ',          val: M.jitter   ?? '—',                                    unit:'ms', cls: M.jitter != null && M.jitter > 200  ? 'warn' : '' },
    { label:`SLA ≤${M.slaThreshold}ms`, val: M.sla != null ? M.sla+'%' : '—',             unit:'',   cls: c3(M.sla, 90, 70) },
    { label:'Incidents',         val: M.incidents,                                            unit:'',   cls: M.incidents === 0 ? 'good' : M.incidents < 3 ? 'warn' : 'bad' },
    { label:'Last DOWN',         val: M.lastDown,                                             unit:'',   cls: M.lastDown === 'never' ? 'good' : '' },
  ].map(t => `<div class="metric-tile">
    <div class="mt-label">${t.label}</div>
    <div class="mt-row"><span class="mt-val ${t.cls}">${t.val}</span>${t.unit ? `<span class="mt-unit">${t.unit}</span>` : ''}</div>
  </div>`).join('');

  const tMap = { rising:'↑ rising latency', falling:'↓ improving', stable:'→ stable' };
  document.getElementById('trendRow').innerHTML = [
    M.trend ? `<span class="trend-chip ${M.trend}">${tMap[M.trend]}</span>` : '',
    M.trend && M.min != null ? `<span class="trend-sep">·</span>` : '',
    M.min != null ? `<span>min <b>${M.min}ms</b></span><span class="trend-sep">/</span><span>max <b>${M.max}ms</b></span>` : '',
  ].join('');

  drawMainChart(m, M);
  drawStatusStrip(m);
  drawHistogram(m, M);
}

// ── SLA threshold apply ───────────────────────────────────────
function applySlaThreshold() {
  const val = parseInt(document.getElementById('slaInput').value);
  if (!val || val < 50 || val > 30000) return;
  const m = monitors.find(x => x.id === selectedId);
  if (!m) return;
  m.slaThreshold = val;
  refreshMainCard(m);
  saveToStorage();
}

// ── Notifications ─────────────────────────────────────────────
async function toggleNotify() {
  const btn = document.getElementById('notifyBtn');
  if (!('Notification' in window)) {
    btn.textContent = '🚫 No API';
    btn.classList.add('denied');
    return;
  }
  if (notifyEnabled) {
    notifyEnabled = false;
    updateNotifyBtn();
    return;
  }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') {
    notifyEnabled = true;
    // Test notification
    new Notification('Status Monitor', { body: 'Notifications enabled ✓', tag: 'test', silent: true });
  } else {
    btn.textContent = '🚫 Blocked';
    btn.classList.add('denied');
    setTimeout(() => { btn.textContent = '🔔 Notify'; btn.classList.remove('denied'); }, 3000);
  }
  updateNotifyBtn();
}

function updateNotifyBtn() {
  const btn = document.getElementById('notifyBtn');
  btn.textContent = notifyEnabled ? '🔔 Notify on' : '🔔 Notify';
  btn.classList.toggle('notify-on', notifyEnabled);
}

function showNotification(m) {
  if (!notifyEnabled || Notification.permission !== 'granted') return;
  try {
    new Notification(`🔴 ${m.label} is DOWN`, {
      body: `No response from ${m.url}`,
      tag:  m.id,
      requireInteraction: false,
    });
  } catch(_) {}
}

// ── Chart 1: Latency line chart ───────────────────────────────
function drawMainChart(m, M) {
  const canvas = document.getElementById('mainChart');
  if (!m || !canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth; const H = 120;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const hist = state[m.id].hist;
  if (hist.length < 2) return;

  const PL = 48, PB = 20, PT = 8, PR = 8;
  const cW = W - PL - PR, cH = H - PT - PB;
  const MAX = 60;
  const lats = hist.map(h => h.latency ?? 0);
  const maxL = Math.max(...lats, 80);
  const toX  = i => PL + (i / (MAX - 1)) * cW;
  const toY  = l => PT + (1 - l / maxL) * cH;

  for (let i = 0; i <= 4; i++) {
    const y = PT + cH * (i / 4);
    ctx.strokeStyle = 'rgba(28,43,66,0.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke();
    ctx.fillStyle = '#2d4060'; ctx.textAlign = 'right'; ctx.font = '9px monospace';
    ctx.fillText(Math.round(maxL * (1 - i / 4)), PL - 4, y + 3.5);
  }

  // SLA threshold line
  if (M && M.slaThreshold && M.slaThreshold <= maxL) {
    const sy = toY(M.slaThreshold);
    ctx.save(); ctx.setLineDash([2, 4]);
    ctx.strokeStyle = 'rgba(35,209,139,0.3)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PL, sy); ctx.lineTo(W - PR, sy); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(35,209,139,0.4)'; ctx.textAlign = 'right'; ctx.font = '8px monospace';
    ctx.fillText('sla', PL - 4, sy + 3);
  }

  // P95 dashed reference
  if (M && M.p95) {
    const py = toY(M.p95);
    ctx.save(); ctx.setLineDash([4, 4]);
    ctx.strokeStyle = 'rgba(240,168,48,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PL, py); ctx.lineTo(W - PR, py); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = 'rgba(240,168,48,0.55)'; ctx.textAlign = 'right'; ctx.font = '8px monospace';
    ctx.fillText('p95', PL - 4, py + 3);
  }

  const si = MAX - hist.length;
  hist.forEach((h, i) => {
    if (!h.up) { ctx.fillStyle = 'rgba(240,80,80,0.13)'; ctx.fillRect(toX(si+i) - 1, PT, 3, cH); }
  });

  ctx.beginPath();
  hist.forEach((h, i) => { const x=toX(si+i), y=toY(h.latency??0); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.lineTo(toX(si+hist.length-1), H-PB); ctx.lineTo(toX(si), H-PB); ctx.closePath();
  const ag = ctx.createLinearGradient(0, PT, 0, H-PB);
  ag.addColorStop(0, hexAlpha(m.color, 0.2)); ag.addColorStop(1, hexAlpha(m.color, 0.01));
  ctx.fillStyle = ag; ctx.fill();

  ctx.beginPath(); ctx.strokeStyle = m.color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';
  hist.forEach((h, i) => { const x=toX(si+i), y=toY(h.latency??0); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.stroke();

  const last = hist[hist.length - 1];
  ctx.beginPath(); ctx.arc(toX(si+hist.length-1), toY(last.latency??0), 3, 0, Math.PI*2);
  ctx.fillStyle = m.color; ctx.shadowColor = m.color; ctx.shadowBlur = 8;
  ctx.fill(); ctx.shadowBlur = 0;

  ctx.fillStyle = '#2d4060'; ctx.textAlign = 'center'; ctx.font = '9px monospace';
  [0, 0.25, 0.5, 0.75, 1].forEach(f => {
    const i = Math.round(f * (hist.length - 1));
    if (hist[i]) ctx.fillText(
      hist[i].ts.toLocaleTimeString('en', { hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false }),
      toX(si+i), H - 4
    );
  });
}

// ── Chart 2: Status strip ─────────────────────────────────────
function drawStatusStrip(m) {
  const canvas = document.getElementById('statusStrip');
  if (!m || !canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth; const H = 14;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const MAX  = 60;
  const hist = state[m.id].hist;
  const segW = W / MAX;
  const gap  = 1.2;
  let upCount = 0, dnCount = 0;

  for (let i = 0; i < MAX; i++) {
    const di = hist.length - (MAX - i);
    let color;
    if (di < 0) {
      color = 'rgba(28,43,66,0.35)';
    } else {
      hist[di].up ? upCount++ : dnCount++;
      color = hist[di].up ? '#23d18b' : '#f05050';
    }
    ctx.fillStyle = color;
    frr(ctx, i * segW + gap / 2, 0, segW - gap, H, 2);
  }

  const note = document.getElementById('stripNote');
  if (note) note.textContent = `${upCount} up · ${dnCount} down in window`;
}

// ── Chart 3: Histogram ────────────────────────────────────────
function drawHistogram(m, M) {
  const canvas = document.getElementById('histChart');
  if (!m || !canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth; const H = 84;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const lats = state[m.id].hist.filter(h => h.latency != null).map(h => h.latency);
  if (!lats.length) return;

  const p95v  = (M && M.p95) ? M.p95 : 1000;
  const bMax  = Math.max(p95v * 1.5, 1000);
  const step  = bMax / 5;
  const bounds = [0, step, step*2, step*3, step*4, bMax, Infinity];
  const fmt   = v => v >= 1000 ? (v/1000).toFixed(1)+'k' : Math.round(v)+'';
  const labels = bounds.slice(0, -1).map((b, i) =>
    i === bounds.length - 2 ? fmt(b)+'+' : fmt(b)+'–'+fmt(bounds[i+1])
  );
  const counts = Array(labels.length).fill(0);
  lats.forEach(l => {
    for (let i = 0; i < bounds.length - 1; i++) {
      if (l >= bounds[i] && l < bounds[i+1]) { counts[i]++; break; }
    }
  });

  const maxCount = Math.max(...counts, 1);
  const PL = 28, PB = 20, PT = 16, PR = 8;
  const cW = W - PL - PR, cH = H - PT - PB;
  const barW = cW / labels.length;
  const gap  = Math.max(3, barW * 0.12);

  counts.forEach((c, i) => {
    const bH = Math.max((c / maxCount) * cH, c > 0 ? 2 : 0);
    const x  = PL + i * barW + gap / 2;
    const y  = PT + cH - bH;
    const w  = barW - gap;

    const bg = ctx.createLinearGradient(0, y, 0, y + bH);
    bg.addColorStop(0, hexAlpha(m.color, 0.85));
    bg.addColorStop(1, hexAlpha(m.color, 0.3));
    ctx.fillStyle = bg;
    frr(ctx, x, y, w, bH, 2);

    if (c > 0) {
      ctx.fillStyle = m.color; ctx.textAlign = 'center';
      ctx.font = 'bold 9px monospace';
      ctx.fillText(c, x + w / 2, y - 3);
    }

    if (M) {
      [{ v: M.p95, lbl: 'p95', col: 'rgba(240,168,48,0.8)' },
       { v: M.p99, lbl: 'p99', col: 'rgba(240,80,80,0.7)'  }].forEach(({ v, lbl, col }) => {
        if (v == null || bounds[i+1] === Infinity) return;
        if (v >= bounds[i] && v < bounds[i+1]) {
          const px = x + (v - bounds[i]) / (bounds[i+1] - bounds[i]) * w;
          ctx.strokeStyle = col; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(px, PT); ctx.lineTo(px, PT + cH); ctx.stroke();
          ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.font = '8px monospace';
          ctx.fillText(lbl, px, PT - 2);
        }
      });
      // SLA threshold marker
      if (M.slaThreshold && M.slaThreshold >= bounds[i] && M.slaThreshold < bounds[i+1] && bounds[i+1] !== Infinity) {
        const sx = x + (M.slaThreshold - bounds[i]) / (bounds[i+1] - bounds[i]) * w;
        ctx.strokeStyle = 'rgba(35,209,139,0.6)'; ctx.lineWidth = 1.5;
        ctx.setLineDash([2, 3]);
        ctx.beginPath(); ctx.moveTo(sx, PT); ctx.lineTo(sx, PT + cH); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(35,209,139,0.6)'; ctx.textAlign = 'center'; ctx.font = '8px monospace';
        ctx.fillText('sla', sx, PT - 2);
      }
    }

    ctx.fillStyle = '#2d4060'; ctx.textAlign = 'center'; ctx.font = '8px monospace';
    ctx.fillText(labels[i], x + w / 2, H - 4);
  });

  ctx.fillStyle = '#2d4060'; ctx.textAlign = 'right'; ctx.font = '9px monospace';
  ctx.fillText(maxCount, PL - 3, PT + 4);
  ctx.fillText(0, PL - 3, PT + cH + 2);
}

// ── Chart 4: Comparison ───────────────────────────────────────
function drawComparisonChart() {
  const canvas = document.getElementById('compChart');
  if (!canvas || !monitors.length) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth;
  const ROW = 42;
  const H   = monitors.length * ROW + 24;
  canvas.style.height = H + 'px';
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const PL = Math.min(140, W * 0.3), PR = 62, PT = 10, PB = 18;
  const cW = W - PL - PR;

  const allVals = monitors.flatMap(m => {
    const last = state[m.id].hist[state[m.id].hist.length - 1];
    const M    = computeMetrics(m.id);
    return [last ? (last.latency ?? 0) : 0, M.p95 ?? 0];
  });
  const maxVal = Math.max(...allVals, 100);

  monitors.forEach((m, i) => {
    const s    = state[m.id];
    const M    = computeMetrics(m.id);
    const last = s.hist[s.hist.length - 1];
    const cur  = last && last.up && last.latency != null ? last.latency : 0;
    const isUp = last ? last.up : true;
    const midY = PT + i * ROW + ROW / 2;
    const bH   = 20;
    const y    = midY - bH / 2;

    const lbl = m.label.length > 22 ? m.label.slice(0, 21) + '…' : m.label;
    ctx.fillStyle = '#4a6080'; ctx.textAlign = 'right'; ctx.font = '10px system-ui,sans-serif';
    ctx.fillText(lbl, PL - 8, midY + 4);

    ctx.fillStyle = 'rgba(28,43,66,0.5)';
    frr(ctx, PL, y, cW, bH, 3);

    if (M.avg) {
      frr.call(null, ctx, PL, y, Math.min((M.avg / maxVal) * cW, cW), bH, 3);
      ctx.fillStyle = hexAlpha(m.color, 0.18);
      frr(ctx, PL, y, Math.min((M.avg / maxVal) * cW, cW), bH, 3);
    }

    const bw = isUp ? Math.max(Math.min((cur / maxVal) * cW, cW), cur > 0 ? 4 : 0) : cW;
    if (bw > 0) {
      const bg = ctx.createLinearGradient(PL, 0, PL + bw, 0);
      bg.addColorStop(0, hexAlpha(m.color, 0.4));
      bg.addColorStop(1, isUp ? m.color : '#f05050');
      ctx.fillStyle = bg;
      frr(ctx, PL, y, bw, bH, 3);
    }

    if (M.avg) {
      const ax = PL + Math.min((M.avg / maxVal) * cW, cW);
      ctx.save(); ctx.setLineDash([3, 3]);
      ctx.strokeStyle = hexAlpha(m.color, 0.5); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ax, y); ctx.lineTo(ax, y + bH); ctx.stroke();
      ctx.restore();
    }

    if (M.p95) {
      const px = PL + Math.min((M.p95 / maxVal) * cW, cW);
      ctx.fillStyle = 'rgba(240,168,48,0.85)';
      frr(ctx, px - 1, y, 2, bH, 1);
    }

    ctx.textAlign = 'left';
    ctx.fillStyle = isUp ? m.color : '#f05050';
    ctx.font = 'bold 10px monospace';
    ctx.fillText(isUp ? (cur > 0 ? cur + 'ms' : '—') : 'DOWN', PL + cW + 6, midY + 1);
    if (M.avg != null) {
      ctx.fillStyle = '#2d4060'; ctx.font = '9px monospace';
      ctx.fillText('avg ' + M.avg, PL + cW + 6, midY + 13);
    }
  });

  const legY = H - PB + 6;
  ctx.fillStyle = '#2d4060'; ctx.textAlign = 'left'; ctx.font = '8px monospace';
  ctx.save(); ctx.setLineDash([3, 3]);
  ctx.strokeStyle = 'rgba(100,140,170,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(PL, legY); ctx.lineTo(PL + 18, legY); ctx.stroke();
  ctx.restore();
  ctx.fillText('avg', PL + 22, legY + 3);
  ctx.fillStyle = 'rgba(240,168,48,0.8)';
  frr(ctx, PL + 42, legY - 3, 2, 7, 1);
  ctx.fillStyle = '#2d4060'; ctx.fillText('p95', PL + 47, legY + 3);
}

// ── Chart 5: Combined line chart ──────────────────────────────
function drawBigChart() {
  const canvas = document.getElementById('bigChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W   = canvas.offsetWidth; const H = 90;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, W, H);

  const PL = 44, PB = 6, PT = 6, PR = 8;
  const cW = W - PL - PR, cH = H - PT - PB;
  const MAX = 60;
  const allLats = monitors.flatMap(m => state[m.id].hist.map(h => h.latency ?? 0));
  const maxL    = Math.max(...allLats, 80);

  for (let i = 0; i <= 3; i++) {
    const y = PT + cH * (i / 3);
    ctx.strokeStyle = 'rgba(28,43,66,0.8)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(PL, y); ctx.lineTo(W - PR, y); ctx.stroke();
    ctx.fillStyle = '#2d4060'; ctx.textAlign = 'right'; ctx.font = '9px monospace';
    ctx.fillText(Math.round(maxL * (1 - i / 3)), PL - 4, y + 3.5);
  }

  const toX = i => PL + (i / (MAX - 1)) * cW;
  const toY = l => PT + (1 - l / maxL) * cH;

  monitors.forEach(m => {
    const hist = state[m.id].hist;
    if (hist.length < 2) return;
    const si = MAX - hist.length;
    ctx.beginPath(); ctx.strokeStyle = m.color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.globalAlpha = 0.88;
    hist.forEach((h, i) => { const x=toX(si+i), y=toY(h.latency??0); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
    ctx.stroke(); ctx.globalAlpha = 1;
    const last = hist[hist.length - 1];
    ctx.beginPath(); ctx.arc(toX(si+hist.length-1), toY(last.latency??0), 2, 0, Math.PI*2);
    ctx.fillStyle = m.color; ctx.shadowColor = m.color; ctx.shadowBlur = 5;
    ctx.fill(); ctx.shadowBlur = 0;
  });
}

// ── Strip pills ───────────────────────────────────────────────
function buildStrip() {
  const el = document.getElementById('strip');
  el.innerHTML = '<span class="strip-label">All</span>';
  monitors.forEach(m => {
    const pill = document.createElement('div');
    pill.className = 'strip-pill' + (m.id === selectedId ? ' active' : '');
    pill.id = 'spill-' + m.id;
    pill.onclick = () => switchTo(m.id);
    pill.innerHTML =
      `<span class="strip-dot" id="sdot-${m.id}" style="background:${m.color}"></span>` +
      `<span class="strip-name">${m.label}</span>` +
      `<span class="strip-lat"  id="slat-${m.id}">—</span>` +
      `<button class="strip-remove" onclick="removeMonitor(event,'${m.id}')">✕</button>`;
    el.appendChild(pill);
  });
}

function updateStripPill(m, r) {
  const dot = document.getElementById('sdot-' + m.id);
  const lat = document.getElementById('slat-' + m.id);
  if (!dot) return;
  dot.style.background = r.up ? m.color : 'var(--down)';
  lat.textContent = r.up && r.latency != null ? r.latency + 'ms' : r.up ? '—' : 'DOWN';
  lat.style.color = r.up ? '' : 'var(--down)';
}

// ── Select / switch ───────────────────────────────────────────
function rebuildSelect() {
  document.getElementById('urlSelect').innerHTML = monitors.map(m =>
    `<option value="${m.id}"${m.id === selectedId ? ' selected' : ''}>${m.label}</option>`
  ).join('');
}

function rebuildLegend() {
  document.getElementById('legend').innerHTML = monitors.map(m =>
    `<div class="legend-item"><span class="legend-dot" style="background:${m.color}"></span>${m.label}</div>`
  ).join('');
}

function switchTo(id) {
  selectedId = id;
  rebuildSelect(); buildStrip(); rebuildLegend();
  const m = monitors.find(x => x.id === id);
  if (m) refreshMainCard(m);
}

function onSelectChange() { switchTo(document.getElementById('urlSelect').value); }

// ── Add / Remove ──────────────────────────────────────────────
function addUrl() {
  const inp = document.getElementById('addInput');
  let url = inp.value.trim();
  if (!url) return;
  if (!url.startsWith('http')) url = 'https://' + url;
  const label = url.replace(/^https?:\/\//,'').replace(/\/$/,'');
  const color = PALETTE[paletteIdx % PALETTE.length]; paletteIdx++;
  const id = 'u' + Date.now();
  monitors.push({ id, url, label, color, slaThreshold: 500 });
  initState(id);
  rebuildSelect(); buildStrip(); rebuildLegend();
  inp.value = '';
  saveToStorage();
}

function removeMonitor(e, id) {
  e.stopPropagation();
  monitors = monitors.filter(m => m.id !== id);
  delete state[id];
  if (selectedId === id && monitors.length) selectedId = monitors[0].id;
  rebuildSelect(); buildStrip(); rebuildLegend();
  const m = monitors.find(x => x.id === selectedId);
  if (m) refreshMainCard(m);
  saveToStorage();
}

// ── Controls ──────────────────────────────────────────────────
function setIntervalSec(sec) {
  intervalMs = sec * 1000;
  document.querySelectorAll('.pill').forEach(b => b.classList.toggle('active', b.dataset.sec === String(sec)));
  restart();
  saveToStorage();
}
function toggleSound() {
  soundOn = !soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundOn ? '🔔 Sound on' : '🔕 Sound';
  btn.classList.toggle('on', soundOn);
}
function togglePause() {
  paused = !paused;
  const btn = document.getElementById('pauseBtn');
  btn.textContent = paused ? '▶ Resume' : '⏸ Pause';
  btn.classList.toggle('paused', paused);
  if (paused) { clearInterval(timerId); timerId = null; } else restart();
}
function toggleLogFilter() {
  logFilterSelected = !logFilterSelected;
  document.getElementById('logFilterBtn').textContent = logFilterSelected ? 'Selected URL' : 'All URLs';
}
function clearLog() { document.getElementById('logBody').innerHTML = ''; }

// ── Log ──────────────────────────────────────────────────────
function appendLog(m, r, ts) {
  if (logFilterSelected && m.id !== selectedId) return;
  const body = document.getElementById('logBody');
  const row  = document.createElement('div');
  row.className = 'log-row';
  row.style.borderLeftColor = m.color;
  const latTxt   = r.latency != null ? r.latency + 'ms' : 'timeout';
  const latColor = r.latency == null ? 'var(--down)' : r.latency > 800 ? 'var(--warn)' : m.color;
  row.innerHTML =
    `<span class="log-ts">${ts.toLocaleTimeString()}</span>` +
    `<span class="log-st ${r.up?'up':'dn'}">${r.up?'UP':'DOWN'}</span>` +
    `<span style="font-family:monospace;color:${latColor}">${latTxt}</span>` +
    `<span class="log-lbl">${m.label}</span>`;
  body.prepend(row);
  while (body.children.length > 500) body.removeChild(body.lastChild);
}

// ── Sound ─────────────────────────────────────────────────────
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const o  = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.frequency.value = 440; o.type = 'sine';
    g.gain.setValueAtTime(0.3, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
    o.start(); o.stop(ac.currentTime + 0.4);
  } catch(_) {}
}

// ── Helpers ───────────────────────────────────────────────────
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function frr(ctx, x, y, w, h, r) {
  if (w <= 0 || h <= 0) return;
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
  ctx.fill();
}

function restart() {
  clearInterval(timerId);
  timerId = setInterval(tick, intervalMs);
}

window.addEventListener('beforeunload', saveToStorage);
window.addEventListener('resize', () => {
  const m = monitors.find(x => x.id === selectedId);
  if (m) {
    const M = computeMetrics(m.id);
    drawMainChart(m, M);
    drawStatusStrip(m);
    drawHistogram(m, M);
  }
  drawComparisonChart();
  drawBigChart();
});

// ── Init ──────────────────────────────────────────────────────
const restored = loadFromStorage();
if (!restored) {
  monitors = DEFAULT_MONITORS.map(m => ({ ...m }));
  monitors.forEach(m => initState(m.id));
}

// Sync interval pill
document.querySelectorAll('.pill').forEach(b => {
  b.classList.toggle('active', parseInt(b.dataset.sec) * 1000 === intervalMs);
});

rebuildSelect();
buildStrip();
rebuildLegend();
renderSessionBar();
tick();
restart();
</script>
