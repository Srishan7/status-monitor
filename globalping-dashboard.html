<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Global Latency — Marici</title>
<style>
/* ── Dark (default) ── */
:root {
  --bg:         #080d18;
  --surface:    #0f1624;
  --surface-alt:#1c2b42;
  --border:     #1c2b42;
  --row-border: rgba(28,43,66,0.5);
  --text:       #dde4f0;
  --muted:      #4a6080;
  --up:         #23d18b;
  --warn:       #f0a830;
  --down:       #f05050;
  --accent:     #00c8f0;
  --btn-text:   #080d18;
  --purple:     #a78bfa;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:         #f0f4f9;
    --surface:    #ffffff;
    --surface-alt:#e0e8f2;
    --border:     #c8d8eb;
    --row-border: rgba(180,200,225,0.45);
    --text:       #1a2535;
    --muted:      #6b839e;
    --up:         #0e8f5c;
    --warn:       #a07000;
    --down:       #c42020;
    --accent:     #0070a0;
    --btn-text:   #ffffff;
    --purple:     #6d4fc2;
  }
}
:root[data-theme="light"] {
  --bg:         #f0f4f9;
  --surface:    #ffffff;
  --surface-alt:#e0e8f2;
  --border:     #c8d8eb;
  --row-border: rgba(180,200,225,0.45);
  --text:       #1a2535;
  --muted:      #6b839e;
  --up:         #0e8f5c;
  --warn:       #a07000;
  --down:       #c42020;
  --accent:     #0070a0;
  --btn-text:   #ffffff;
  --purple:     #6d4fc2;
}
:root[data-theme="dark"] {
  --bg:         #080d18;
  --surface:    #0f1624;
  --surface-alt:#1c2b42;
  --border:     #1c2b42;
  --row-border: rgba(28,43,66,0.5);
  --text:       #dde4f0;
  --muted:      #4a6080;
  --up:         #23d18b;
  --warn:       #f0a830;
  --down:       #f05050;
  --accent:     #00c8f0;
  --btn-text:   #080d18;
  --purple:     #a78bfa;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  font-size: 13px; min-height: 100vh; padding: 1.25rem 1.5rem;
}

/* ── TOPBAR ── */
.topbar {
  display: flex; align-items: center; gap: 0.75rem;
  margin-bottom: 1rem; flex-wrap: wrap;
}
.brand { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent); }
.subtitle { font-size: 0.68rem; color: var(--muted); margin-left: 0.25rem; }
.spacer { flex: 1; }
.run-btn {
  background: var(--accent); color: var(--btn-text); border: none; border-radius: 6px;
  padding: 0.35rem 1rem; font-weight: 700; font-size: 0.75rem; cursor: pointer;
  transition: opacity .15s;
}
.run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.icon-btn {
  background: var(--surface); border: 1px solid var(--border); color: var(--muted);
  border-radius: 5px; padding: 0.28rem 0.65rem; font-size: 0.72rem; cursor: pointer;
}
.icon-btn:hover { border-color: var(--muted); color: var(--text); }
.icon-btn.active { border-color: var(--accent); color: var(--accent); }
.status-line { font-size: 0.65rem; color: var(--muted); }

/* ── TOKEN ROW ── */
.token-row {
  display: flex; align-items: center; gap: 0.5rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 7px; padding: 0.3rem 0.3rem 0.3rem 0.8rem; margin-bottom: 0.75rem;
}
.token-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; }
.token-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: #a78bfa; font-family: monospace; font-size: 0.74rem; min-width: 0;
}
.token-input::placeholder { color: var(--muted); }
.token-set {
  background: var(--surface-alt); border: 1px solid var(--border); color: var(--text);
  border-radius: 4px; padding: 0.22rem 0.6rem; font-size: 0.65rem;
  cursor: pointer; white-space: nowrap;
}
.token-set:hover { border-color: var(--accent); }

/* ── SETTINGS PANEL ── */
.settings-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.75rem;
  display: none;
}
.settings-section { margin-bottom: 0.75rem; }
.settings-section:last-child { margin-bottom: 0; }
.settings-title {
  font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.09em;
  color: var(--muted); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem;
}
.settings-title span { flex: 1; }
.loc-count { font-size: 0.58rem; color: var(--accent); }

.target-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
@media (max-width: 600px) { .target-grid { grid-template-columns: 1fr; } }

.target-row { display: flex; flex-direction: column; gap: 0.25rem; }
.target-row-label { font-size: 0.58rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.target-input-group { display: flex; gap: 0.25rem; }
.setting-input {
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text); font-size: 0.72rem; padding: 0.22rem 0.45rem;
  outline: none; font-family: monospace; min-width: 0;
}
.setting-input:focus { border-color: var(--accent); }
.host-input { flex: 2; }
.path-input { flex: 1; }

.region-group { margin-bottom: 0.45rem; }
.region-label {
  font-size: 0.56rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); margin-bottom: 0.25rem;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 0.2rem; }
.loc-chip {
  display: inline-flex; align-items: center; gap: 0.2rem;
  background: var(--surface-alt); border: 1px solid var(--border);
  border-radius: 4px; padding: 0.12rem 0.35rem; font-size: 0.63rem;
  cursor: pointer; user-select: none; transition: border-color .1s, background .1s, color .1s;
  white-space: nowrap;
}
.loc-chip.selected {
  background: rgba(0,200,240,0.12); border-color: var(--accent); color: var(--accent);
}
:root[data-theme="light"] .loc-chip.selected { background: rgba(0,112,160,0.1); }
.loc-chip:hover:not(.selected) { border-color: var(--muted); color: var(--text); }

.settings-actions { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.6rem; }
.save-btn {
  background: var(--accent); color: var(--btn-text); border: none;
  border-radius: 5px; padding: 0.28rem 0.8rem; font-size: 0.7rem; font-weight: 700; cursor: pointer;
}
.sel-all { font-size: 0.63rem; color: var(--muted); cursor: pointer; padding: 0.2rem 0.4rem; }
.sel-all:hover { color: var(--text); }

/* ── GRID ── */
.grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 0.75rem; margin-top: 0.5rem;
}
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 0.75rem 1rem;
}
.card-title {
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.25rem;
}
.card-url { font-family: monospace; font-size: 0.72rem; color: var(--accent); margin-bottom: 0.25rem; }

/* ── TABLE ── */
table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
th {
  font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--muted); padding: 0.3rem 0.5rem; text-align: left;
  border-bottom: 1px solid var(--border);
}
td { padding: 0.28rem 0.5rem; border-bottom: 1px solid var(--row-border); }
tr:last-child td { border-bottom: none; }

.loc-cell { display: flex; align-items: center; gap: 0.4rem; }
.flag { font-size: 0.9rem; }
.loc-name { font-size: 0.72rem; color: var(--text); }
.loc-city { font-size: 0.62rem; color: var(--muted); }

.lat { font-family: monospace; font-weight: 700; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.lat.good { color: var(--up); }
.lat.warn { color: var(--warn); }
.lat.bad  { color: var(--down); }
.lat.slow { color: var(--purple); }
.lat.pending { color: var(--muted); font-style: italic; font-weight: 400; font-size: 0.68rem; }

.http-status { font-size: 0.68rem; font-family: monospace; color: var(--muted); }
.http-status.s2 { color: var(--up); }
.http-status.s3 { color: var(--warn); }
.http-status.s4, .http-status.s5 { color: var(--down); }

/* ── LEGEND ── */
.legend {
  display: flex; gap: 1rem; margin-top: 0.75rem;
  font-size: 0.62rem; color: var(--muted); flex-wrap: wrap;
}
.legend span { display: flex; align-items: center; gap: 0.3rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">🌍 Global Latency</span>
  <span class="subtitle" id="locBadge">— locations worldwide</span>
  <span class="spacer"></span>
  <span class="status-line" id="statusLine">Enter token and click Run.</span>
  <button class="run-btn" id="runBtn" onclick="runPings()">▶ Run Global Ping</button>
  <button class="icon-btn" id="cfgBtn" onclick="toggleSettings()">⚙ Configure</button>
  <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark">☀️</button>
  <a href="status-monitor.html" class="icon-btn" style="text-decoration:none">← Monitor</a>
</div>

<div class="token-row">
  <span class="token-label">Globalping Token</span>
  <input class="token-input" id="tokenInput" type="password" placeholder="Paste your token here…" />
  <button class="token-set" onclick="saveToken()">SET</button>
  <button class="token-set" onclick="clearToken()" style="color:var(--down)">✕</button>
</div>

<!-- Settings panel -->
<div class="settings-panel" id="settingsPanel">

  <div class="settings-section">
    <div class="settings-title"><span>Target URLs</span></div>
    <div class="target-grid">
      <div class="target-row">
        <div class="target-row-label">Target 1</div>
        <div class="target-input-group">
          <input class="setting-input host-input" id="t1host" placeholder="e.g. marici.org" />
          <input class="setting-input path-input" id="t1path" placeholder="/shine" />
        </div>
      </div>
      <div class="target-row">
        <div class="target-row-label">Target 2</div>
        <div class="target-input-group">
          <input class="setting-input host-input" id="t2host" placeholder="e.g. example.com" />
          <input class="setting-input path-input" id="t2path" placeholder="/" />
        </div>
      </div>
    </div>
  </div>

  <div class="settings-section">
    <div class="settings-title">
      <span>Locations</span>
      <span class="loc-count" id="pendingCount">0 selected</span>
    </div>
    <div id="locationChips"></div>
    <div class="settings-actions">
      <button class="save-btn" onclick="saveSettings()">✓ Save & Close</button>
      <span class="sel-all" onclick="selectAllLocs()">Select all</span>
      <span class="sel-all" onclick="clearAllLocs()">Clear all</span>
    </div>
  </div>

</div>

<div class="grid">
  <div class="card">
    <div class="card-title">Target 1</div>
    <div class="card-url" id="card1url">—</div>
    <table>
      <thead><tr><th>Location</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="body1"></tbody>
    </table>
  </div>
  <div class="card">
    <div class="card-title">Target 2</div>
    <div class="card-url" id="card2url">—</div>
    <table>
      <thead><tr><th>Location</th><th>Total</th><th>Status</th></tr></thead>
      <tbody id="body2"></tbody>
    </table>
  </div>
</div>

<div class="legend">
  <span><span class="dot" style="background:var(--up)"></span> &lt;100ms excellent</span>
  <span><span class="dot" style="background:var(--warn)"></span> 100–300ms good</span>
  <span><span class="dot" style="background:var(--down)"></span> 300–600ms slow</span>
  <span><span class="dot" style="background:var(--purple)"></span> &gt;600ms very slow</span>
</div>

<script>
const API       = 'https://api.globalping.io/v1/measurements';
const TOKEN_KEY = 'gp_token';
const LOCS_KEY  = 'gp_locations';
const TGTS_KEY  = 'gp_targets';
const THEME_KEY = 'gp_theme';

// ── All available locations ──
const ALL_LOCATIONS = [
  { magic:'US', flag:'🇺🇸', name:'United States',  region:'Americas',     limit:2 },
  { magic:'CA', flag:'🇨🇦', name:'Canada',          region:'Americas',     limit:1 },
  { magic:'BR', flag:'🇧🇷', name:'Brazil',          region:'Americas',     limit:1 },
  { magic:'MX', flag:'🇲🇽', name:'Mexico',          region:'Americas',     limit:1 },
  { magic:'AR', flag:'🇦🇷', name:'Argentina',       region:'Americas',     limit:1 },
  { magic:'GB', flag:'🇬🇧', name:'United Kingdom',  region:'Europe',       limit:1 },
  { magic:'DE', flag:'🇩🇪', name:'Germany',         region:'Europe',       limit:1 },
  { magic:'FR', flag:'🇫🇷', name:'France',          region:'Europe',       limit:1 },
  { magic:'NL', flag:'🇳🇱', name:'Netherlands',     region:'Europe',       limit:1 },
  { magic:'SE', flag:'🇸🇪', name:'Sweden',          region:'Europe',       limit:1 },
  { magic:'PL', flag:'🇵🇱', name:'Poland',          region:'Europe',       limit:1 },
  { magic:'IT', flag:'🇮🇹', name:'Italy',           region:'Europe',       limit:1 },
  { magic:'ES', flag:'🇪🇸', name:'Spain',           region:'Europe',       limit:1 },
  { magic:'FI', flag:'🇫🇮', name:'Finland',         region:'Europe',       limit:1 },
  { magic:'CH', flag:'🇨🇭', name:'Switzerland',     region:'Europe',       limit:1 },
  { magic:'AT', flag:'🇦🇹', name:'Austria',         region:'Europe',       limit:1 },
  { magic:'SG', flag:'🇸🇬', name:'Singapore',       region:'Asia-Pacific', limit:1 },
  { magic:'JP', flag:'🇯🇵', name:'Japan',           region:'Asia-Pacific', limit:1 },
  { magic:'AU', flag:'🇦🇺', name:'Australia',       region:'Asia-Pacific', limit:1 },
  { magic:'IN', flag:'🇮🇳', name:'India',           region:'Asia-Pacific', limit:1 },
  { magic:'KR', flag:'🇰🇷', name:'South Korea',     region:'Asia-Pacific', limit:1 },
  { magic:'HK', flag:'🇭🇰', name:'Hong Kong',       region:'Asia-Pacific', limit:1 },
  { magic:'TW', flag:'🇹🇼', name:'Taiwan',          region:'Asia-Pacific', limit:1 },
  { magic:'MY', flag:'🇲🇾', name:'Malaysia',        region:'Asia-Pacific', limit:1 },
  { magic:'TH', flag:'🇹🇭', name:'Thailand',        region:'Asia-Pacific', limit:1 },
  { magic:'ID', flag:'🇮🇩', name:'Indonesia',       region:'Asia-Pacific', limit:1 },
  { magic:'AE', flag:'🇦🇪', name:'UAE',             region:'ME & Africa',  limit:1 },
  { magic:'ZA', flag:'🇿🇦', name:'South Africa',    region:'ME & Africa',  limit:1 },
  { magic:'NG', flag:'🇳🇬', name:'Nigeria',         region:'ME & Africa',  limit:1 },
  { magic:'TR', flag:'🇹🇷', name:'Turkey',          region:'ME & Africa',  limit:1 },
];

const DEFAULT_LOCS = ['US','CA','BR','GB','DE','FR','NL','IN','AE','SG','JP','KR','AU','ZA'];
const DEFAULT_TGTS = [
  { host: 'marici.org',      path: '/shine' },
  { host: 'secure.qgiv.com', path: '/for/businessmasteryaug2026/' },
];

// ── Persistence helpers ──
function getSelectedMagics() {
  try { const v = localStorage.getItem(LOCS_KEY); return v ? JSON.parse(v) : DEFAULT_LOCS; }
  catch { return DEFAULT_LOCS; }
}
function saveSelectedMagics(arr) { localStorage.setItem(LOCS_KEY, JSON.stringify(arr)); }

function getTargets() {
  try { const v = localStorage.getItem(TGTS_KEY); return v ? JSON.parse(v) : DEFAULT_TGTS; }
  catch { return DEFAULT_TGTS; }
}
function saveTargetsLS(arr) { localStorage.setItem(TGTS_KEY, JSON.stringify(arr)); }

function getActiveLocations() {
  const sel = new Set(getSelectedMagics());
  return ALL_LOCATIONS.filter(l => sel.has(l.magic));
}

// ── Token ──
function sanitizeToken(t) { return t.replace(/[^\x20-\x7E]/g, '').trim(); }
function getToken() { return sanitizeToken(localStorage.getItem(TOKEN_KEY) || ''); }
function saveToken() {
  const v = sanitizeToken(document.getElementById('tokenInput').value);
  if (!v) return;
  localStorage.setItem(TOKEN_KEY, v);
  document.getElementById('tokenInput').value = '••••••••••••••••';
  setStatus('Token saved.');
}
function clearToken() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('tokenInput').value = '';
  setStatus('Token cleared.');
}
function setStatus(msg) { document.getElementById('statusLine').textContent = msg; }

// ── Settings panel ──
let pendingLocs = new Set();
let settingsOpen = false;

function toggleSettings() {
  if (settingsOpen) closeSettings();
  else openSettings();
}

function openSettings() {
  settingsOpen = true;
  pendingLocs = new Set(getSelectedMagics());

  const tgts = getTargets();
  document.getElementById('t1host').value = tgts[0]?.host || '';
  document.getElementById('t1path').value = tgts[0]?.path || '/';
  document.getElementById('t2host').value = tgts[1]?.host || '';
  document.getElementById('t2path').value = tgts[1]?.path || '/';

  renderChips();
  document.getElementById('settingsPanel').style.display = 'block';
  document.getElementById('cfgBtn').classList.add('active');
  document.getElementById('cfgBtn').textContent = '✕ Close';
}

function closeSettings() {
  settingsOpen = false;
  document.getElementById('settingsPanel').style.display = 'none';
  document.getElementById('cfgBtn').classList.remove('active');
  document.getElementById('cfgBtn').textContent = '⚙ Configure';
}

function toggleLoc(magic) {
  if (pendingLocs.has(magic)) pendingLocs.delete(magic);
  else pendingLocs.add(magic);
  renderChips();
}
function selectAllLocs() { ALL_LOCATIONS.forEach(l => pendingLocs.add(l.magic)); renderChips(); }
function clearAllLocs()  { pendingLocs.clear(); renderChips(); }

function renderChips() {
  const regions = ['Americas', 'Europe', 'Asia-Pacific', 'ME & Africa'];
  document.getElementById('locationChips').innerHTML = regions.map(region => {
    const locs = ALL_LOCATIONS.filter(l => l.region === region);
    return `<div class="region-group">
      <div class="region-label">${region}</div>
      <div class="chip-row">${locs.map(l => {
        const sel = pendingLocs.has(l.magic);
        return `<span class="loc-chip${sel ? ' selected' : ''}" onclick="toggleLoc('${l.magic}')" title="${l.name}">
          ${l.flag} ${l.magic}
        </span>`;
      }).join('')}</div>
    </div>`;
  }).join('');
  document.getElementById('pendingCount').textContent = `${pendingLocs.size} selected`;
}

function saveSettings() {
  const strip = s => s.trim().replace(/^https?:\/\//i, '').replace(/^\/\//, '');
  const tgts = [
    { host: strip(document.getElementById('t1host').value), path: document.getElementById('t1path').value.trim() || '/' },
    { host: strip(document.getElementById('t2host').value), path: document.getElementById('t2path').value.trim() || '/' },
  ];
  saveTargetsLS(tgts);
  saveSelectedMagics([...pendingLocs]);
  updateCardDisplays();
  closeSettings();
  setStatus(`Saved — ${pendingLocs.size} locations, 2 targets.`);
}

function updateCardDisplays() {
  const tgts  = getTargets();
  const count = getActiveLocations().length;
  document.getElementById('card1url').textContent = tgts[0] ? `${tgts[0].host}${tgts[0].path}` : '—';
  document.getElementById('card2url').textContent = tgts[1] ? `${tgts[1].host}${tgts[1].path}` : '—';
  document.getElementById('locBadge').textContent = `${count} locations worldwide`;
}

// ── Latency / status helpers ──
function latClass(ms) {
  if (ms == null) return 'lat pending';
  if (ms < 100)  return 'lat good';
  if (ms < 300)  return 'lat warn';
  if (ms < 600)  return 'lat bad';
  return 'lat slow';
}
function statusClass(code) {
  if (!code) return 'http-status';
  return `http-status s${Math.floor(code / 100)}`;
}

const COUNTRY_FLAGS = {
  US:'🇺🇸',CA:'🇨🇦',GB:'🇬🇧',DE:'🇩🇪',FR:'🇫🇷',NL:'🇳🇱',
  SG:'🇸🇬',JP:'🇯🇵',AU:'🇦🇺',IN:'🇮🇳',BR:'🇧🇷',ZA:'🇿🇦',
  KR:'🇰🇷',AE:'🇦🇪',SE:'🇸🇪',PL:'🇵🇱',IT:'🇮🇹',ES:'🇪🇸',
  FI:'🇫🇮',CH:'🇨🇭',AT:'🇦🇹',MX:'🇲🇽',AR:'🇦🇷',HK:'🇭🇰',
  TW:'🇹🇼',MY:'🇲🇾',TH:'🇹🇭',ID:'🇮🇩',NG:'🇳🇬',TR:'🇹🇷',
};

// ── Render table ──
function renderProbes(bodyId, probes) {
  const tbody = document.getElementById(bodyId);
  if (!probes || probes.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" style="color:var(--muted);font-style:italic;padding:0.5rem">Waiting for results…</td></tr>';
    return;
  }
  const sorted = [...probes].sort((a, b) => (a.total ?? 9999) - (b.total ?? 9999));
  tbody.innerHTML = sorted.map(p => {
    const flag    = COUNTRY_FLAGS[p.country] || '🌐';
    const latStr  = p.total != null ? `${p.total}ms` : '—';
    const cls     = latClass(p.total);
    const sCls    = statusClass(p.statusCode);
    const tip     = p.resolvedAddress ? ` title="${p.resolvedAddress}"` : '';
    return `<tr>
      <td>
        <div class="loc-cell">
          <span class="flag">${flag}</span>
          <div>
            <div class="loc-name">${p.city || p.country}</div>
            <div class="loc-city">${p.network || ''}</div>
          </div>
        </div>
      </td>
      <td><span class="${cls}"${tip}>${latStr}</span></td>
      <td><span class="${sCls}">${p.statusCode || '—'}</span></td>
    </tr>`;
  }).join('');
}

// ── API ──
async function createMeasurement(host, path, locs, token) {
  const resp = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({
      type: 'http',
      target: host,
      locations: locs.map(l => ({ magic: l.magic, limit: l.limit })),
      measurementOptions: { request: { method: 'GET', path } },
    }),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  return (await resp.json()).id;
}

async function pollMeasurement(id, token, bodyId) {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 1000));
    const resp = await fetch(`${API}/${id}`, { headers: { 'Authorization': `Bearer ${token}` } });
    const data = await resp.json();
    const probes = (data.results || []).map(r => ({
      city:            r.probe?.city    || '',
      country:         r.probe?.country || '',
      network:         r.probe?.network || '',
      total:           r.result?.timings?.total != null ? Math.round(r.result.timings.total) : null,
      statusCode:      r.result?.statusCode ?? null,
      resolvedAddress: r.result?.resolvedAddress || '',
    }));
    renderProbes(bodyId, probes);
    if (data.status === 'finished') return probes;
  }
  return [];
}

async function runPings() {
  const token = getToken();
  if (!token) { setStatus('⚠ Set your Globalping token first.'); return; }

  const tgts = getTargets();
  const locs = getActiveLocations();
  if (locs.length === 0) { setStatus('⚠ Select at least one location in Configure.'); return; }

  const btn = document.getElementById('runBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Running…';

  renderProbes('body1', []);
  renderProbes('body2', []);
  setStatus(`Firing HTTP checks from ${locs.length} locations… (~15s)`);

  try {
    const [id1, id2] = await Promise.all([
      createMeasurement(tgts[0].host, tgts[0].path, locs, token),
      createMeasurement(tgts[1].host, tgts[1].path, locs, token),
    ]);
    setStatus('Polling results…');
    await Promise.all([
      pollMeasurement(id1, token, 'body1'),
      pollMeasurement(id2, token, 'body2'),
    ]);
    setStatus(`Last run: ${new Date().toLocaleTimeString()} — ${locs.length} regions`);
  } catch (e) {
    setStatus(`Error: ${e.message}`);
  }

  btn.disabled = false;
  btn.textContent = '↻ Run Again';
}

// ── Theme toggle ──
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'light' ? '🌙' : '☀️';
}
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, next);
  applyTheme(next);
}

// ── Init ──
applyTheme(localStorage.getItem(THEME_KEY) || 'dark');
updateCardDisplays();

const saved = getToken();
if (saved) {
  document.getElementById('tokenInput').value = '••••••••••••••••';
  setStatus('Token loaded. Click Run Global Ping.');
}
</script>
